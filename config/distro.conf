# Branding and identity for the whole build. Change these to rebrand the
# distribution; every script, the ISO, GRUB and the installer read them.
DISTRO_NAME="Gentoo Linux"
DISTRO_SHORT="Gentoo"
# Lowercase id used for file names (ISO name, installer, helper scripts).
DISTRO_ID="gentoo"
# Tag appended to ISO names so the AM4 builds are recognisable.
DISTRO_VARIANT="am4"
# Portage profile the image is built on (OpenRC + KDE Plasma).
PORTAGE_PROFILE="default/linux/amd64/23.0/desktop/plasma"
# Stage3 tarball flavour (OpenRC desktop).
STAGE3_FLAVOUR="stage3-amd64-desktop-openrc"
STAGE3_MIRROR="https://distfiles.gentoo.org/releases/amd64/autobuilds"
# Name of the user in the live session.
LIVE_USER="live"
# Default locale of the image (the installer lets the user pick another one).
DEFAULT_LOCALE="en_US.UTF-8"
