# Zen 5 (Ryzen 9000, AM5) - e.g. Ryzen 7 9700X, Ryzen 7 9800X3D, Ryzen 9 9950X.
# Needs GCC 14 or newer (znver5). Does NOT run on Zen 4 or older.
CPU_ID="zen5"
CPU_VENDOR="AuthenticAMD"
CPU_DESC="AMD Zen 5 (Ryzen 9000, e.g. Ryzen 7 9800X3D / Ryzen 9 9950X)"
CPU_CFLAGS="-march=znver5"
CPU_RUST="znver5"
# Output of cpuid2cpuflags on a Ryzen 9 9950X.
CPU_FLAGS_X86="aes avx avx2 avx512_bf16 avx512_bitalg avx512_vbmi2 avx512_vnni avx512_vp2intersect avx512_vpopcntdq avx512bw avx512cd avx512dq avx512f avx512ifma avx512vbmi avx512vl avx_vnni f16c fma3 mmx mmxext pclmul popcnt rdrand sha sse sse2 sse3 sse4_1 sse4_2 sse4a ssse3 vpclmulqdq"
CPU_REQUIRED_FLAGS="avx2 fma bmi2 sha_ni sse4a vaes vpclmulqdq avx512f avx512bw avx512vl avx512_bf16 avx512_vnni avx512_vp2intersect avx_vnni movdiri movdir64b"
CPU_PACKAGES=""
