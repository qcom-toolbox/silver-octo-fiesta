# Zen 3 (Ryzen 5000) - e.g. Ryzen 7 5700G and Ryzen 9 5950X.
# Uses Zen 3-only instructions (VAES, VPCLMULQDQ): does NOT run on Zen+/Zen 2.
CPU_ID="zen3"
CPU_VENDOR="AuthenticAMD"
CPU_DESC="AMD Zen 3 (Ryzen 5000, e.g. Ryzen 7 5700G / Ryzen 9 5950X)"
CPU_CFLAGS="-march=znver3"
CPU_RUST="znver3"
# Output of cpuid2cpuflags on a Ryzen 9 5950X / Ryzen 7 5700G.
CPU_FLAGS_X86="aes avx avx2 f16c fma3 mmx mmxext pclmul popcnt rdrand sha sse sse2 sse3 sse4_1 sse4_2 sse4a ssse3 vpclmulqdq"
CPU_REQUIRED_FLAGS="avx2 fma bmi2 sha_ni sse4a vaes vpclmulqdq"
CPU_PACKAGES=""
