# Zen 3 (Ryzen 5000 series) - e.g. Ryzen 7 5700G and Ryzen 9 5950X.
# Binaries use Zen 3-only instructions (VAES, VPCLMULQDQ, ...): this edition
# does NOT run on Zen+/Zen 2 CPUs such as the 2600X.
CPU_ID="zen3"
CPU_DESC="AMD Zen 3 (Ryzen 5000, e.g. Ryzen 7 5700G / Ryzen 9 5950X)"
CPU_MARCH="znver3"
# Minimum AMD CPU family the image runs on (0x19 = Zen 3/Zen 4).
CPU_MIN_FAMILY=25
# Output of cpuid2cpuflags on a Ryzen 9 5950X / Ryzen 7 5700G.
CPU_FLAGS_X86="aes avx avx2 f16c fma3 mmx mmxext pclmul popcnt rdrand sha sse sse2 sse3 sse4_1 sse4_2 sse4a ssse3 vpclmulqdq"
CPU_REQUIRED_HOST_FLAGS="avx2 sha_ni vaes vpclmulqdq"
