# Zen+ / Zen (Ryzen 1000 & 2000 series) - e.g. Ryzen 5 2600X.
# Also runs on Zen 2 (Ryzen 3000) and every newer Ryzen, just less tuned.
CPU_ID="zenplus"
CPU_DESC="AMD Zen/Zen+ (Ryzen 1000/2000, e.g. Ryzen 5 2600X)"
CPU_MARCH="znver1"
# Minimum AMD CPU family the image runs on (0x17 = Zen/Zen+/Zen2).
CPU_MIN_FAMILY=23
# Output of cpuid2cpuflags on a Ryzen 5 2600X.
CPU_FLAGS_X86="aes avx avx2 f16c fma3 mmx mmxext pclmul popcnt rdrand sha sse sse2 sse3 sse4_1 sse4_2 sse4a ssse3"
# /proc/cpuinfo flags the *build host* needs to run code built for this edition.
CPU_REQUIRED_HOST_FLAGS="avx2 sha_ni"
