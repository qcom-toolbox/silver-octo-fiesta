# Zen / Zen+ / Zen 2 (Ryzen 1000, 2000, 3000) - e.g. Ryzen 5 2600X.
# Runs on every AMD Ryzen, just less tuned on the newer ones.
CPU_ID="zenplus"
CPU_VENDOR="AuthenticAMD"
CPU_DESC="AMD Zen/Zen+/Zen 2 (Ryzen 1000-3000, e.g. Ryzen 5 2600X)"
CPU_CFLAGS="-march=znver1"
CPU_RUST="znver1"
# Output of cpuid2cpuflags on a Ryzen 5 2600X.
CPU_FLAGS_X86="aes avx avx2 f16c fma3 mmx mmxext pclmul popcnt rdrand sha sse sse2 sse3 sse4_1 sse4_2 sse4a ssse3"
# /proc/cpuinfo flags a CPU needs to run this edition. Checked on the build
# host (code runs during the build) and by the installer.
CPU_REQUIRED_FLAGS="avx2 fma bmi2 sha_ni sse4a"
CPU_PACKAGES=""
