# Any 64-bit x86 CPU: virtual machines with any CPU model (QEMU's default
# qemu64/kvm64, VirtualBox, Hyper-V, VMware, Xen), older or low-end PCs
# (Pentium/Celeron without AVX2) and anything the other editions do not cover.
# Slower than a tuned edition on real hardware.
CPU_ID="generic"
CPU_VENDOR=""
CPU_DESC="Any x86-64 CPU and virtual machines (generic, untuned)"
CPU_CFLAGS="-march=x86-64 -mtune=generic"
CPU_RUST="x86-64"
CPU_FLAGS_X86="mmx mmxext sse sse2"
CPU_REQUIRED_FLAGS="lm sse2"
CPU_PACKAGES=""
