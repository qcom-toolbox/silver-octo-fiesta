# Intel Core from 2020 on: 10th gen (Comet Lake) to 14th gen (Raptor Lake) and
# Core Ultra (Meteor/Arrow/Lunar Lake). Built for x86-64-v3 (AVX2), the level
# all of them share, and tuned for modern Intel cores.
# Note: Pentium and Celeron models without AVX2 are not supported.
CPU_ID="intel"
CPU_VENDOR="GenuineIntel"
CPU_DESC="Intel Core 10th gen and newer (2020+, incl. Core Ultra)"
CPU_CFLAGS="-march=x86-64-v3 -mtune=intel"
CPU_RUST="x86-64-v3"
# The CPU_FLAGS_X86 every 2020+ Intel Core CPU has (Comet Lake has no SHA).
CPU_FLAGS_X86="aes avx avx2 f16c fma3 mmx mmxext pclmul popcnt rdrand sse sse2 sse3 sse4_1 sse4_2 ssse3"
CPU_REQUIRED_FLAGS="avx2 fma bmi1 bmi2 movbe f16c"
# AMD microcode ships in linux-firmware; Intel's is a separate package.
CPU_PACKAGES="sys-firmware/intel-microcode"
