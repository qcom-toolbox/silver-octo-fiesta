# Load NVIDIA early so KWin/SDDM never start on the simpledrm framebuffer.
#
# dracut sources this file with bash. The modules are only added when they are
# already built for the kernel being processed: on a kernel upgrade the first
# initramfs is made before nvidia-drivers is rebuilt (which then regenerates
# the initramfs again with the modules), and a missing module would abort it.
if [[ -n ${kernel:-} ]] && [[ -n $(find "/lib/modules/${kernel}" -name 'nvidia-drm.ko*' -print -quit 2>/dev/null) ]]; then
	add_drivers+=" nvidia nvidia_modeset nvidia_uvm nvidia_drm "
fi
omit_drivers+=" nouveau "
