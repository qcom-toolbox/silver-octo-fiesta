# Generic (non host-only) initramfs: the same image boots after hardware
# changes, e.g. swapping the graphics card or moving the disk.
hostonly="no"
compress="zstd"
add_drivers+=" amdgpu nvme ahci btrfs ext4 vfat dm_crypt "
# Virtual machine disks: QEMU/KVM, VMware, Hyper-V, Xen
add_drivers+=" virtio_pci virtio_blk virtio_scsi vmw_pvscsi hv_vmbus hv_storvsc xen_blkfront "
# Unlock a LUKS2-encrypted root (installer option); asks for the passphrase
# at boot when the kernel command line has rd.luks.uuid=...
add_dracutmodules+=" crypt "
