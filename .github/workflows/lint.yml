name: lint

on:
  push:
  pull_request:

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck build.sh scripts/lib.sh scripts/chroot/*.sh installer/gentoo-installer \
            rootfs/usr/local/bin/gentoo-update rootfs/usr/local/sbin/gentoo-snapshot \
            rootfs/usr/local/sbin/gentoo-vm-detect rootfs/etc/init.d/vm-guest \
            rootfs/etc/cron.*/gentoo-snapshot rootfs/etc/bash/bashrc.d/*.sh \
            config/gpu/nvidia/rootfs/etc/elogind/system-sleep/nvidia

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: unit tests
        working-directory: installer
        run: python -m pytest -q tests
